policy_id: paper.manual_reconciliation
policy_version: "1"
required_documents: [rent_invoice, tax_invoice]
required_invoice_fields:
  - vendor_id
  - store_id
  - contract_number
  - invoice_number
  - invoice_date
  - currency
  - service_period_start
  - service_period_end
  - subtotal
  - tax_amount
  - total
  - bank_account
required_tax_fields:
  - vendor_id
  - store_id
  - invoice_number
  - contract_number
  - tax_invoice_number
  - tax_invoice_date
  - currency
  - taxable_amount
  - tax_amount
  - total
required_supporting_types: []
fixed_rent_basis: approved_extension
amount_tolerance: "0.00"
override_codes:
  - bank_mismatch
  - bank_reference_missing
  - amount_mismatch
  - pricing_basis_unconfigured
  - unsupported_pricing
  - extraction_warnings
  - approved_installment_allocation
  - installment_conditions_review
  - source_pricing_discrepancy
approver_roles: [admin, accountant, ap_approver]
require_independent_approval: false
repository_timeout_seconds: 15
