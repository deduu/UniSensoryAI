web_search:
  provider: duckduckgo
  base_url: "https://html.duckduckgo.com/html/"
  lite_url: "https://lite.duckduckgo.com/lite/"
  timeout_seconds: 10.0
  max_results: 3
  max_queries: 4
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36"

trusted_sources:
  enabled: true
  max_sources: 4
  sources:
    - name: "NIST AI Risk Management Framework"
      url: "https://www.nist.gov/itl/ai-risk-management-framework"
      topics: ["ai risk management", "ai governance", "trustworthy ai", "ai assessment", "ai measurement"]
    - name: "OECD AI Principles"
      url: "https://oecd.ai/en/ai-principles"
      topics: ["ai principles", "trustworthy ai", "human-centered ai", "ai accountability", "international ai policy"]
    - name: "EU AI Act"
      url: "https://artificialintelligenceact.eu/the-act/"
      topics: ["eu ai act", "high-risk ai", "ai regulation", "prohibited ai", "ai compliance"]
    - name: "White House Executive Order on AI"
      url: "https://www.whitehouse.gov/briefing-room/presidential-actions/2023/10/30/executive-order-on-the-safe-secure-and-trustworthy-development-and-use-of-artificial-intelligence/"
      topics: ["ai executive order", "safe ai", "secure ai", "ai oversight", "federal ai policy"]

llm:
  enabled: true
  provider: anthropic
  model: claude-opus-4-7
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 4000
  enable_prompt_cache: true
  max_proposal_clauses: 30
  max_reference_chars: 12000
