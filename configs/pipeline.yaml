pipelines:
  basic:
    description: "Basic document processing pipeline"
    stages:
      - ingestion
      - conversion
      - inference
      - formatting
    stage_timeout_s: 60

  advanced:
    description: >
      Full pipeline with hybrid PDF extraction, schema-driven structured
      output, per-page content critic, and enrichment into content_chunks.
      Use this for invoice/receipt/form documents where typed extraction
      and validation matter.
    stages:
      - ingestion
      - conversion
      - inference
      - content_validation
      - structured_output
      - enrichment
      - formatting
    stage_timeout_s: 90
