pipelines:
  basic:
    description: "Basic document processing pipeline"
    stages:
      - ingestion
      - conversion
      - inference
      - formatting
    stage_timeout_s: 60

  advanced:
    description: "Advanced pipeline with validation and routing"
    stages:
      - ingestion
      - validation
      - routing
      - conversion
      - inference
      - content_validation
      - enrichment
      - formatting
    stage_timeout_s: 90
