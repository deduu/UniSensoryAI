services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-unisensory}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # Only the API needs Redis. Keeping it internal avoids host port conflicts.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        INSTALL_LOCAL_VLM: ${DOCKER_LOCAL_VLM:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-unisensory}
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: ${QUEUE_BACKEND:-redis}
      UPLOADS_DIR: /app/data/uploads
      EXTRACTION_CONFIG_PATH: ${EXTRACTION_CONFIG_PATH:-/app/configs/extraction.yaml}
      EXTRACTION_BASE_URL: ${EXTRACTION_BASE_URL:-${OPENAI_API_BASE:-https://api.openai.com/v1}}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-4o}
      EXTRACTION_API_KEY: ${EXTRACTION_API_KEY:-${OPENAI_API_KEY:-}}
      EXTRACTION_WORKFLOW_TIMEOUT_SECONDS: ${EXTRACTION_WORKFLOW_TIMEOUT_SECONDS:-1800}
      PAPER_RECONCILIATION_CONFIG_PATH: ${PAPER_RECONCILIATION_CONFIG_PATH:-/app/configs/paper_reconciliation.yaml}
      # The browser must receive a public callback, never http://api:8010.
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8010}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./src:/app/src:ro
      - ./configs:/app/configs:ro
      - ./alembic:/app/alembic:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:8010
      # Reliable file-change detection for Docker Desktop bind mounts.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
